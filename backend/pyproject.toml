[project]
name = "backend"
version = "0.1.0"
description = "Elsewhere"

requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "langchain>=1.4.0",
    "langchain-deepseek>=1.1.0",
    "langsmith>=0.12.4",
    "openai>=3.13.0",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
backend = "backend.main:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"
